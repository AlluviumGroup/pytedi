[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pytedi"
version = "0.3.0"
description = "Python Tool for Estimating Dam Impacts (TEDI)"
readme = "readme.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENCE"]

authors = [
    { name = "Robert Morden" },
    { name = "Ella Guthrie" },
    { name = "Joel Rahman" },
]
dependencies = [
    "pandas",
    "numpy",
    "numba",
]

[project.urls]
Homepage = "https://github.com/AlluviumGroup/pytedi"

[tool.setuptools.packages.find]
include = ["pytedi*"]
exclude = ["pytedi_planning*", "pytedi_testing*"]
